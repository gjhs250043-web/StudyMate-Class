<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyMate Class</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f7fb;color:#182235}header{background:#182235;color:white;padding:17px 25px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1000px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #e1e6ee;border-radius:15px;padding:20px;margin-bottom:16px}.login{max-width:440px;margin:70px auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{padding:14px;background:#fff;border:2px solid #dfe5ed;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}.choices button.sel{border-color:#2867d8;background:#edf4ff;color:#2867d8}input,textarea{width:100%;padding:11px;margin:8px 0;border:1px solid #d5dce6;border-radius:8px;font:inherit}.btn{background:#2867d8;color:#fff;border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}.secondary{background:#e9eef7;color:#2867d8}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer}.tabs button.on{background:#2867d8;color:#fff}.hidden{display:none}.notice,.status{padding:14px;border:1px solid #e1e6ee;border-radius:10px;margin:9px 0}.pin{border-left:5px solid #2867d8}.chat{height:430px;overflow-y:auto;border:1px solid #e1e6ee;border-radius:10px;padding:12px;background:#fafbfd}.msg{max-width:78%;padding:10px;margin:8px 0;background:#eef3fb;border-radius:12px}.mine{margin-left:auto;background:#e9f1ff}.meta{font-size:12px;color:#718096}.chatrow{display:flex;gap:8px;margin-top:9px}.chatrow input{margin:0}.error{color:#c33;font-size:13px}.present{background:#eaf8f1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body>
<div id="login" class="panel login"><h1>StudyMate</h1><p class="meta">우리 반 공지 · 출석 · 대화</p>
<div id="student"><h3>학생 로그인</h3><div class="choices"><button onclick="pick('최성국',this)">최성국</button><button onclick="pick('이현찬',this)">이현찬</button><button onclick="pick('정혁',this)">정혁</button><button onclick="pick('한태웅',this)">한태웅</button></div><input id="spw" type="password" placeholder="비밀번호"></div>
<div id="teacher" class="hidden"><h3>선생님 로그인</h3><input id="tpw" type="password" placeholder="비밀번호"></div><div id="err" class="error"></div><button class="btn" onclick="login()">로그인</button> <button id="switchBtn" class="btn secondary" onclick="toggle()">선생님 로그인으로 전환</button></div>
<div id="app" class="hidden"><header><b>StudyMate Class</b><span><span id="who"></span> <button class="btn secondary" onclick="logout()">로그아웃</button></span></header><div class="wrap">
<div id="studentApp" class="hidden"><div class="tabs"><button class="on" onclick="stab('sn',this)">📢 공지</button><button onclick="stab('sa',this)">✅ 출석</button><button onclick="stab('sc',this)">💬 채팅</button></div>
<div id="sn" class="panel"><h2>공지사항</h2><div id="notices"></div></div><div id="sa" class="hidden panel"><h2>오늘 출석</h2><p id="attInfo"></p><button id="attBtn" class="btn" onclick="attendance()">출석 체크</button></div><div id="sc" class="hidden panel"><h2>💬 우리 반 대화창</h2><div id="chat" class="chat"></div><div class="chatrow"><input id="chatInput" maxlength="300" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">전송</button></div></div></div>
<div id="teacherApp" class="hidden"><div class="tabs"><button class="on" onclick="ttab('tn',this)">📢 공지 관리</button><button onclick="ttab('ta',this)">✅ 출석 관리</button><button onclick="ttab('tc',this)">💬 채팅</button></div>
<div id="tn" class="grid"><div class="panel"><h2>공지 작성</h2><input id="title" placeholder="제목"><textarea id="content" placeholder="내용"></textarea><label><input id="pinned" type="checkbox" style="width:auto"> 중요 공지 상단 고정</label><br><br><button class="btn" onclick="addNotice()">등록</button></div><div class="panel"><h2>공지 목록</h2><div id="tnotices"></div></div></div>
<div id="ta" class="hidden panel"><h2>오늘 출석 현황</h2><div id="alist"></div></div><div id="tc" class="hidden panel"><h2>💬 우리 반 대화창</h2><div id="tchat" class="chat"></div><div class="chatrow"><input id="tchatInput" maxlength="300" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">전송</button></div></div></div>
</div></div>
<script>
let token=localStorage.getItem("sm_token")||"",me=null,name="",tm=false,timer;const $=id=>document.getElementById(id);
async function api(u,o={}){let h={"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;let r=await fetch(u,{...o,headers:{...h,...(o.headers||{})}}),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||"오류");return d}
function pick(n,b){name=n;document.querySelectorAll(".choices button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")}
function toggle(){tm=!tm;$("student").classList.toggle("hidden",tm);$("teacher").classList.toggle("hidden",!tm);$("switchBtn").textContent=tm?"학생 로그인으로 전환":"선생님 로그인으로 전환"}
async function login(){try{let n=tm?"이수빈":name,p=tm?$("tpw").value:$("spw").value;if(!n||!p){$("err").textContent="이름과 비밀번호를 확인하세요.";return}let d=await api("/api/login",{method:"POST",body:JSON.stringify({name:n,password:p})});token=d.token;me=d.user;localStorage.setItem("sm_token",token);show();refresh()}catch(e){$("err").textContent=e.message}}
async function start(){if(!token)return;try{me=await api("/api/me");show();refresh()}catch(e){logout()}}
function show(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=me.name+(me.role==="teacher"?" 선생님":"");$(me.role==="teacher"?"teacherApp":"studentApp").classList.remove("hidden");if(timer)clearInterval(timer);timer=setInterval(loadChat,2500)}
function logout(){localStorage.removeItem("sm_token");location.reload()}
function stab(id,b){["sn","sa","sc"].forEach(x=>$(x).classList.toggle("hidden",x!==id));document.querySelectorAll("#studentApp .tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(id==="sc")loadChat()}
function ttab(id,b){["tn","ta","tc"].forEach(x=>$(x).classList.toggle("hidden",x!==id));document.querySelectorAll("#teacherApp .tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(id==="tc")loadChat()}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
async function refresh(){let n=await api("/api/notices");let html=n.length?n.map(x=>`<div class="notice ${x.pinned?"pin":""}"><b>${x.pinned?"📌 ":""}${esc(x.title)}</b><p>${esc(x.content)}</p><span class="meta">${x.author}</span></div>`).join(""):"<p class='meta'>등록된 공지가 없습니다.</p>";$("notices").innerHTML=html;if(me.role==="teacher"){$("tnotices").innerHTML=n.map(x=>`<div class="notice"><b>${esc(x.title)}</b><p>${esc(x.content)}</p><button class="btn secondary" onclick="del('${x.id}')">삭제</button></div>`).join("")||"<p class='meta'>등록된 공지가 없습니다.</p>";let a=await api("/api/teacher/attendance");$("alist").innerHTML=a.students.map(x=>`<div class="status ${x.attended?"present":""}"><b>${x.name}</b> — ${x.attended?"🟢 출석":"⚪ 미출석"}</div>`).join("")}else{let a=await api("/api/my-attendance"),today=new Date().toISOString().slice(0,10),ok=a.some(x=>x.date===today);$("attInfo").textContent=ok?"오늘 출석이 완료되었습니다. 누적 "+a.length+"회":"아직 오늘 출석하지 않았습니다. 누적 "+a.length+"회";$("attBtn").disabled=ok}}
async function attendance(){await api("/api/attendance",{method:"POST"});refresh()}
async function addNotice(){try{await api("/api/notices",{method:"POST",body:JSON.stringify({title:$("title").value,content:$("content").value,pinned:$("pinned").checked})});$("title").value="";$("content").value="";refresh()}catch(e){alert(e.message)}}
async function del(id){if(confirm("삭제할까요?")){await api("/api/notices/"+id,{method:"DELETE"});refresh()}}
async function loadChat(){if(!me)return;try{let d=await api("/api/messages"),box=me.role==="teacher"?$("tchat"):$("chat"),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.innerHTML=d.length?d.map(x=>`<div class="msg ${x.userId===me.id?"mine":""}"><b>${esc(x.name)}${x.role==="teacher"?" 선생님":""}</b><br>${esc(x.text)}<div class="meta">${new Date(x.createdAt).toLocaleTimeString("ko-KR")}</div></div>`).join(""):"<p class='meta'>첫 메시지를 보내보세요.</p>";if(bottom)box.scrollTop=box.scrollHeight}catch(e){}}
async function send(){let i=me.role==="teacher"?$("tchatInput"):$("chatInput"),text=i.value.trim();if(!text)return;await api("/api/messages",{method:"POST",body:JSON.stringify({text})});i.value="";loadChat()}
start();
</script></body></html>
